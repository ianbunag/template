name: Sync AGENTS.md to Subscribers

on:
  push:
    branches: [main]
    paths: [AGENTS.md]

jobs:
  prepare:
    if: github.repository == 'ianbunag/template'
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.parse.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          sparse-checkout: subscribers.txt
          sparse-checkout-cone-mode: false

      - name: Parse subscriber list
        id: parse
        run: |
          repos=$(grep -v '^\s*$\|^\s*#' subscribers.txt | jq -Rnc '[inputs | select(length > 0)]')
          echo "repos=${repos}" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    if: needs.prepare.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
    steps:
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.TARGET_REPO_PAT }}

      - name: Sync AGENTS.md and open PR
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          git config user.name "Template Sync Bot"
          git config user.email "git.template@ianbunag.dev"

          branch="bot/update-agents-md"
          default_branch=$(gh repo view "${{ matrix.repo }}" --json defaultBranchRef --jq '.defaultBranchRef.name')

          # Fetch the remote branch if it exists; create from default otherwise.
          if git ls-remote --exit-code --heads origin "${branch}" > /dev/null 2>&1; then
            git fetch origin "${branch}"
            git checkout "${branch}"
            git reset --hard "origin/${default_branch}"
          else
            git checkout -b "${branch}"
          fi

          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/AGENTS.md" \
            -o AGENTS.md

          if git diff --quiet; then
            echo "AGENTS.md is already up to date in ${{ matrix.repo }}."
            exit 0
          fi

          git add AGENTS.md
          git commit -m "chore: sync AGENTS.md from template repository"
          git push --force-with-lease origin "${branch}"

          # Create a PR only if one doesn't already exist for this branch.
          existing_pr=$(gh pr list --repo "${{ matrix.repo }}" --head "${branch}" --json number --jq '.[0].number')
          if [ -z "${existing_pr}" ]; then
            gh pr create \
              --repo "${{ matrix.repo }}" \
              --head "${branch}" \
              --base "${default_branch}" \
              --title "chore: sync AGENTS.md from template" \
              --body "Automated PR — updates \`AGENTS.md\` to match the [template repository](https://github.com/${{ github.repository }})."
          else
            echo "PR #${existing_pr} already open; branch updated."
          fi
